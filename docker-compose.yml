services:
  proxmox-mcp:
    build: .
    image: proxmox-mcp:latest
    container_name: proxmox-mcp

    # MCP uses stdio for communication
    stdin_open: true
    tty: true

    # Environment variables (loaded from .env file)
    env_file:
      - .env

    # Override SSH key path for container
    environment:
      - PROXMOX_SSH_KEY_PATH=/home/mcp/.ssh/id_proxmox_mcp

    # Mount SSH key read-only
    volumes:
      - ~/.ssh/id_proxmox_mcp:/home/mcp/.ssh/id_proxmox_mcp:ro

    # Security
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 256M

    # Restart policy
    restart: unless-stopped
